<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<title>Meu limite, meu lugar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--forte:#5E7E5F;--claro:#E3EADF;--fundo:#FBF8F3;--texto:#2E2B27;--suave:#77706A;--linha:#ECE4D6;--quente:#C07A5A}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--fundo);color:var(--texto);font:16px/1.6 'Nunito Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
textarea,input{font:inherit}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;line-height:1.12}

.casca{max-width:600px;margin:0 auto;padding:0 16px 48px}
.barra{position:sticky;top:0;z-index:5;background:rgba(251,248,243,.95);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:12px 0}
.barra-top{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:12.5px;font-weight:800;color:var(--suave)}
.trilho{height:6px;border-radius:6px;background:var(--linha);overflow:hidden;margin-top:8px}
.trilho i{display:block;height:100%;background:var(--forte);transform-origin:left;transition:transform .5s cubic-bezier(.2,.9,.3,1)}

.capa{margin-top:16px;border-radius:24px;background:var(--claro);color:var(--forte);text-align:center;padding:32px 24px;animation:entra .6s ease both}
.capa .ilus{width:140px;height:140px;margin:0 auto 8px}
.capa small{font-size:11px;letter-spacing:.16em;font-weight:800;text-transform:uppercase}
.capa h1{font-size:40px;margin:8px 0}
.capa .pub{display:block;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:20px;margin-bottom:8px}
.capa p{font-size:14px;opacity:.85}
.cita{background:#fff;border:1px solid var(--linha);border-radius:16px;padding:16px;margin-top:16px;font-size:15.5px}
.cita q{display:block;font-family:'Cormorant Garamond',serif;font-size:21px;font-style:italic;color:var(--forte);margin-top:8px}
.texto-abre{margin-top:16px;font-size:16.5px}
.como{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.como div{background:#fff;border:1px solid var(--linha);border-radius:14px;padding:12px;text-align:center;font-size:13px;color:var(--suave)}
.como b{display:block;font-size:20px;line-height:1.2;color:var(--forte);font-family:'Cormorant Garamond',serif;white-space:nowrap}

.cartao{margin-top:16px;background:#fff;border:1px solid var(--linha);border-radius:24px;padding:24px 20px;box-shadow:0 18px 40px -28px rgba(60,45,30,.5);animation:entra .45s ease both}
@keyframes entra{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.etiqueta{display:inline-block;font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;background:var(--claro);color:var(--forte);border-radius:999px;padding:4px 12px}
.trans{font-style:italic;color:var(--suave);margin-top:12px;font-size:15px}
.cartao h2{font-size:30px;margin:12px 0 8px}
.cartao .intro{color:var(--suave)}
.frase-t{border-left:3px solid var(--forte);padding:8px 0 8px 16px;margin-top:16px;font-family:'Cormorant Garamond',serif;font-size:20px;font-style:italic}
.frase-t span{display:block;font-family:'Nunito Sans',sans-serif;font-style:normal;font-size:12.5px;font-weight:800;color:var(--forte);margin-top:4px}

.bloco{margin-top:24px;padding-top:24px;border-top:1px dashed var(--linha)}
.bloco h3{font-size:23px;color:var(--texto)}
.bloco .dica{font-size:14px;color:var(--suave);margin-top:4px}

/* escala */
.escala{margin-top:16px}
.valor{display:flex;align-items:baseline;justify-content:center;gap:6px;color:var(--forte)}
.valor b{font-family:'Cormorant Garamond',serif;font-size:52px;line-height:1;transition:transform .2s}
.valor span{font-size:14px;color:var(--suave)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;margin-top:8px;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:10px;background:linear-gradient(90deg,var(--forte) var(--p,50%),var(--linha) var(--p,50%))}
input[type=range]::-moz-range-track{height:10px;border-radius:10px;background:var(--linha)}
input[type=range]::-moz-range-progress{height:10px;border-radius:10px;background:var(--forte)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:32px;height:32px;border-radius:50%;background:#fff;border:3px solid var(--forte);margin-top:-11px;box-shadow:0 4px 12px rgba(0,0,0,.15)}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:#fff;border:3px solid var(--forte)}
input[type=range]:focus-visible{outline:2px solid var(--forte);outline-offset:4px;border-radius:12px}
.pontas{display:flex;justify-content:space-between;font-size:13px;color:var(--suave);font-weight:700}
.termo{height:8px;border-radius:8px;background:var(--linha);margin-top:12px;overflow:hidden}
.termo i{display:block;height:100%;width:50%;border-radius:8px;background:linear-gradient(90deg,var(--claro),var(--quente));transition:width .3s ease}
.nao-mexeu .valor b{opacity:.35}

/* opções (sentimentos, práticas, compromissos) */
.opcoes{display:grid;gap:12px;margin-top:16px}
.opcoes.quatro{grid-template-columns:repeat(2,1fr)}
.op{display:flex;align-items:center;gap:12px;text-align:left;border:1.5px solid var(--linha);border-radius:16px;padding:16px;background:var(--fundo);min-height:64px;transition:border-color .2s,background .2s,transform .2s}
.op:hover{border-color:var(--forte)}
.op:active{transform:scale(.98)}
.op .ic{flex:0 0 40px;height:40px;border-radius:12px;background:#fff;display:grid;place-items:center;color:var(--forte)}
.op .ic svg{width:22px;height:22px}
.op b{display:block;font-size:15.5px}
.op small{display:block;font-size:13.5px;color:var(--suave);margin-top:2px}
.op.sel{border-color:var(--forte);background:var(--claro)}
.op.sel .ic{background:var(--forte);color:#fff}
.quatro .op{flex-direction:column;justify-content:center;text-align:center;padding:16px 8px}

/* frases para marcar */
.frases{display:grid;gap:12px;margin-top:16px}
.fr{display:flex;align-items:center;gap:12px;text-align:left;border:1.5px solid var(--linha);border-radius:16px;padding:16px;background:var(--fundo);min-height:60px;font-size:15.5px;transition:border-color .2s,background .2s}
.fr .ck{flex:0 0 26px;height:26px;border-radius:8px;border:2px solid var(--linha);background:#fff;display:grid;place-items:center;transition:background .2s,border-color .2s}
.fr .ck svg{width:16px;height:16px;opacity:0;color:#fff;transition:opacity .2s}
.fr.sel{border-color:var(--forte);background:var(--claro)}
.fr.sel .ck{background:var(--forte);border-color:var(--forte)}
.fr.sel .ck svg{opacity:1}
.contador{margin-top:12px;font-size:13.5px;font-weight:800;color:var(--forte)}

.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.seg button{border:1.5px solid var(--linha);border-radius:14px;padding:12px 8px;font-weight:800;font-size:14px;background:var(--fundo);min-height:48px}
.seg button.sel{border-color:var(--forte);background:var(--forte);color:#fff}

/* perguntas abertas */
.itens{display:grid;gap:16px;margin-top:16px}
.item label{display:block;font-weight:700;font-size:15px;margin-bottom:8px}
.item textarea{width:100%;min-height:88px;border:1px solid var(--linha);border-radius:14px;padding:12px;font-size:16px;resize:vertical;background:var(--fundo)}
.item textarea:focus{outline:2px solid var(--forte);outline-offset:1px;border-color:transparent;background:#fff}
.passo{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border:1px solid var(--linha);border-radius:14px;cursor:pointer;min-height:56px;background:var(--fundo)}
.passo input{width:22px;height:22px;margin-top:2px;accent-color:var(--forte);flex:0 0 22px}
.passo.feito{background:var(--claro)}
.salvo{font-size:12px;color:var(--suave);margin-top:12px;min-height:18px}

.nav{display:flex;gap:12px;margin-top:24px}
.btn{flex:1;min-height:52px;border-radius:999px;background:var(--forte);color:#fff;font-weight:800;font-size:15.5px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;padding:12px 24px;transition:transform .2s,filter .2s}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:scale(.97)}
.btn.claro{background:#fff;color:var(--forte);border:1.5px solid var(--forte);flex:0 0 auto}
.btn.desligado{opacity:.45;cursor:not-allowed;filter:grayscale(.3)}
.nota-teste{display:block;text-align:center;font-size:12.5px;color:var(--suave);margin-top:8px}

/* resultado */
.res-cab{text-align:center;margin-top:16px;animation:entra .5s ease both}
.res-cab .ilus{width:96px;height:96px;margin:0 auto}
.res-cab small{font-size:11.5px;letter-spacing:.14em;font-weight:800;text-transform:uppercase;color:var(--forte)}
.res-cab h1{font-size:38px;margin:8px 0}
.res-cab p{color:var(--suave);max-width:480px;margin:0 auto}
.dims{display:grid;gap:16px;margin-top:24px}
.dim{background:#fff;border:1px solid var(--linha);border-radius:20px;padding:20px;display:grid;grid-template-columns:96px 1fr;gap:16px;align-items:center;animation:entra .5s ease both}
.dim:nth-child(2){animation-delay:.12s}.dim:nth-child(3){animation-delay:.24s}
.anel{position:relative;width:96px;height:96px}
.anel svg{width:96px;height:96px;transform:rotate(-90deg)}
.anel .fundo{stroke:var(--linha)}
.anel .arco{stroke:var(--forte);stroke-linecap:round;transition:stroke-dashoffset 1.2s cubic-bezier(.2,.9,.3,1)}
.anel.peso .arco{stroke:var(--quente)}
.anel b{position:absolute;inset:0;display:grid;place-items:center;font-family:'Cormorant Garamond',serif;font-size:26px;color:var(--texto)}
.dim h3{font-size:22px}
.faixa{display:inline-block;margin-top:4px;font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:3px 10px;background:var(--claro);color:var(--forte)}
.dim p{font-size:15px;color:var(--suave);margin-top:8px}
.caixa{margin-top:16px;background:#fff;border:1px solid var(--linha);border-radius:20px;padding:20px}
.caixa h3{font-size:22px}
.caixa .lin{display:flex;gap:12px;align-items:flex-start;margin-top:12px;font-size:15px}
.caixa .lin span{flex:0 0 auto;font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--forte);background:var(--claro);border-radius:999px;padding:3px 10px;margin-top:2px}
.passo-semana{background:var(--forte);color:#fff;border-color:var(--forte)}
.passo-semana h3{color:#fff}
.passo-semana p{margin-top:8px;font-size:16px}
.escreveu dl{margin-top:8px}
.escreveu dt{font-weight:700;font-size:14.5px;margin-top:12px}
.escreveu dd{font-size:15px;color:var(--suave);margin-top:4px;padding-left:12px;border-left:2px solid var(--linha)}
.fecha{text-align:center;color:var(--suave);margin-top:24px;font-style:italic}
.acoes-res{display:grid;gap:12px;margin-top:24px}

.aviso-legal{font-size:12.5px;color:var(--suave);text-align:center;margin-top:24px;padding:0 8px}
.assina{text-align:center;font-size:12.5px;color:var(--suave);margin-top:8px}
.erro{margin:30vh auto 0;text-align:center;color:var(--suave)}

@media (min-width:860px){
  .casca{max-width:760px;padding:0 32px 64px}
  .barra{padding:16px 0}
  .capa{padding:48px 40px}
  .capa h1{font-size:48px}
  .cartao{padding:40px 48px;border-radius:28px}
  .cartao h2{font-size:34px}
  .opcoes.quatro{grid-template-columns:repeat(4,1fr)}
  .opcoes.tres{grid-template-columns:repeat(3,1fr)}
  .opcoes.tres .op{flex-direction:column;align-items:flex-start;padding:20px}
  .frases{grid-template-columns:1fr 1fr}
  .dims{grid-template-columns:repeat(3,1fr)}
  .dim{grid-template-columns:1fr;text-align:center;justify-items:center;align-items:start;align-content:start;padding:24px}
  .dim h3{min-height:2.3em;display:flex;align-items:center;justify-content:center}
  .acoes-res{grid-template-columns:1fr auto auto}
}
@media print{
  @page{size:A4;margin:14mm 14mm 16mm}
  html,body{background:#fff!important}
  body{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .barra,.nav,.acoes-res,.nota-teste,.falta-msg,.aviso{display:none!important}
  .dim,.caixa,.cartao,.res-cab,.fecha{box-shadow:none!important;break-inside:avoid;page-break-inside:avoid}
  .arco{transition:none!important}
  .data-res{display:block!important}
}
.data-res{display:none;text-align:center;font-size:12px;color:#8A8177;margin-top:6px}
/* só avança com tudo respondido (05/11) */
.nav .btn.falta{opacity:.5}
.falta-msg{margin:12px 0 0;padding:12px 14px;border-radius:14px;background:#FFF4E8;border:1px solid #EBCB9E;color:#7A4E1D;font-size:14.5px;line-height:1.45}
.falta-msg[hidden]{display:none}
.pendente{border-radius:14px;outline:2px solid #E0A458;outline-offset:10px;animation:chama 1.2s ease 2}
@keyframes chama{50%{outline-color:rgba(224,164,88,.35)}}
@media (prefers-reduced-motion:reduce){.pendente{animation:none}}
.aviso{position:fixed;left:50%;bottom:20px;z-index:60;transform:translate(-50%,30px);opacity:0;background:var(--forte);color:#fff;border-radius:14px;padding:12px 18px;font-size:14px;font-weight:700;box-shadow:0 14px 30px -14px rgba(0,0,0,.5);transition:transform .35s,opacity .3s;max-width:calc(100% - 32px);text-align:center;pointer-events:none}
.aviso.on{transform:translate(-50%,0);opacity:1}
html{scroll-padding-top:84px}
.pendente{scroll-margin-top:96px}
</style>

    var lista = f.map(function (x) { return x[1]; }).filter(function (t) { if (vistos.indexOf(t) >= 0) return false; vistos.push(t); return true; });
    msg.textContent = 'Para continuar, ' + lista.join(', ') + '.'; msg.hidden = false;
    Array.prototype.forEach.call(raiz.querySelectorAll('.pendente'), function (el) { el.classList.remove('pendente'); });
    var alvo = alvoDe(f[0][0]); if (alvo) { void alvo.offsetWidth; alvo.classList.add('pendente'); alvo.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
  }
  // Depois de trocar de tela, ignora toques por um instante: um toque duplo não pula etapa nem marca a resposta da tela seguinte.
  var travadoAte = 0;
  function travado() { return Date.now() < travadoAte; }

  function avisoCli(t) {
    var a = document.getElementById('aviso-cli');
    if (!a) { a = document.createElement('div'); a.id = 'aviso-cli'; a.className = 'aviso'; a.setAttribute('role', 'status'); document.body.appendChild(a); }
    a.textContent = t; a.classList.add('on'); clearTimeout(a._t); a._t = setTimeout(function () { a.classList.remove('on'); }, 3200);
  }
  function marcarSalvo() { var s = document.getElementById('salvo'); if (s) s.textContent = TESTE ? 'Guardado só durante o teste' : 'Salvo neste aparelho'; }
  function ligar() {
    Array.prototype.forEach.call(raiz.querySelectorAll('[data-k]'), function (el) {
      var ev = el.type === 'checkbox' ? 'change' : 'input';
      el.addEventListener(ev, function () {
        var k = el.dataset.k; resp[k] = resp[k] || {};
        resp[k][el.dataset.j] = el.type === 'checkbox' ? el.checked : el.value; guardar();
        if (el.type === 'checkbox') el.closest('.passo').classList.toggle('feito', el.checked);
        marcarSalvo(); avisarEstudio(); atualizarSeguir();
      });
    });
    Array.prototype.forEach.call(raiz.querySelectorAll('[data-nota-k]'), function (box) {
      var k = box.dataset.notaK, j = box.dataset.notaJ, inp = box.querySelector('input'), b = box.querySelector('.valor b'), t = box.querySelector('.termo i');
      var marcar = function () { if (typeof (resp[k] || {})[j] !== 'number') inp.dispatchEvent(new Event('input')); };
      inp.addEventListener('change', marcar); inp.addEventListener('pointerup', marcar); inp.addEventListener('touchend', marcar); inp.addEventListener('keyup', marcar);
      inp.addEventListener('input', function () {
        var v = +inp.value; resp[k] = resp[k] || {}; resp[k][j] = v; guardar(); box.classList.remove('nao-mexeu');
        b.textContent = v; inp.style.setProperty('--p', v * 10 + '%'); t.style.width = v * 10 + '%';
        marcarSalvo(); avisarEstudio(); atualizarSeguir();
      });
    });
    Array.prototype.forEach.call(raiz.querySelectorAll('[data-escala]'), function (box) {
      var campo = box.dataset.escala, inp = box.querySelector('input'), b = box.querySelector('.valor b'), t = box.querySelector('.termo i');
      // tocar na barra já vale como resposta (se ela concorda com o 5, não precisa arrastar)
      var marcar = function () { if (typeof X[campo] !== 'number') inp.dispatchEvent(new Event('input')); };
      inp.addEventListener('change', marcar); inp.addEventListener('pointerup', marcar); inp.addEventListener('touchend', marcar); inp.addEventListener('keyup', marcar);
      inp.addEventListener('input', function () {
        var v = +inp.value; X[campo] = v; guardar(); box.classList.remove('nao-mexeu');
        b.textContent = v; inp.style.setProperty('--p', v * 10 + '%'); t.style.width = v * 10 + '%';
        b.style.transform = 'scale(1.12)'; setTimeout(function () { b.style.transform = ''; }, 160);
        avisarEstudio(); atualizarSeguir();
      });
    });
    var un = function (attr, campo, extra) {
      Array.prototype.forEach.call(raiz.querySelectorAll('[' + attr + ']'), function (bt) {
        bt.addEventListener('click', function () {
          if (travado()) return;
          var v = bt.getAttribute(attr); X[campo] = /^\d+$/.test(v) ? +v : v; guardar();
          Array.prototype.forEach.call(raiz.querySelectorAll('[' + attr + ']'), function (o) { o.classList.toggle('sel', o === bt); });
          if (extra) extra(); avisarEstudio(); atualizarSeguir(); setTimeout(avisarAltura, 30);
        });
      });
    };
    un('data-sent', 'sent'); un('data-comp', 'comp'); un('data-fez', 'fez');
    un('data-prat', 'prat', function () { var f = document.getElementById('fez'); if (f) f.hidden = false; });
    Array.prototype.forEach.call(raiz.querySelectorAll('[data-fr]'), function (bt) {
      bt.addEventListener('click', function () {
        if (travado()) return;
        var j = +bt.dataset.fr, l = X.frases || (X.frases = []), p = l.indexOf(j);
        if (p >= 0) l.splice(p, 1); else l.push(j);
        bt.classList.toggle('sel', p < 0); guardar();
        document.getElementById('contador').textContent = contador(l.length); avisarEstudio(); atualizarSeguir();
      });
    });
    var sv = document.getElementById('salvar-res'); if (sv) sv.addEventListener('click', function () {
      if (typeof window.print !== 'function' || /Instagram|FBAN|FBAV|FB_IAB|WhatsApp|Line\/|MicroMessenger/i.test(navigator.userAgent || '')) { avisoCli('Para salvar o PDF, abra este link no Chrome ou no Safari.'); return; }
      Array.prototype.forEach.call(raiz.querySelectorAll('.arco'), function (a) { a.style.strokeDashoffset = a.dataset.alvo; });
      avisoCli('Na janela que abrir, escolha "Salvar como PDF".');
      var foi = false, vai = function () { if (foi) return; foi = true; setTimeout(function () { window.print(); }, 200); };
      setTimeout(vai, 1500); if (document.fonts && document.fonts.ready) document.fonts.ready.then(vai, vai); else vai();
    });
  }

  // cada tela nova começa do topo, logo abaixo da barra (salto direto: a subida suave para no meio no iPhone)
  function topo() { window.scrollTo(0, 0); requestAnimationFrame(function () { window.scrollTo(0, 0); }); setTimeout(function () { window.scrollTo(0, 0); }, 80); }
  raiz.addEventListener('click', function (e) {
    var b = e.target.closest('[data-ir]'); if (!b) return;
    if (travado()) return;
    var para = +b.dataset.ir;
    if (para > i && i >= 1 && i <= m.cards.length && pendentes(i - 1).length) { cobrar(); return; }
    if (para > i && para > 1) { var inc = primeiraIncompleta(); if (inc >= 0 && para > inc + 1) para = inc + 1; }
    i = para; travadoAte = Date.now() + 550; tela(); topo();
  });
  window.addEventListener('message', function (e) { if (e.origin !== location.origin || !e.data || e.data.tipo !== 'renovo-ir') return; i = +e.data.i || 0; tela(); window.scrollTo(0, 0); });
  if (window.ResizeObserver) new ResizeObserver(avisarAltura).observe(document.body);
  tela();
})();
</script>
